<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Picks</title>
<meta name="description" content="Moon Picks — the definitive ledger of NFL fortunes against the phases of the moon. Consult your team below.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0e1424; --night-2:#161f36; --night-3:#202c49;
    --bone:#ece3d0; --muted:#8b93a8;
    --gold:#d8b24a; --gold-dim:#8a7434; --gold-soft:rgba(216,178,74,.13);
    --curse:#c76b5a; --ledger:#68c0c9; --ledger-ink:#0a1420;
    --line:rgba(236,227,208,.12);
    --serif:"Fraunces",Georgia,serif;
    --sans:"IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--night);color:var(--bone);
    font-family:var(--sans);line-height:1.55;
    background-image:radial-gradient(1100px 600px at 50% -10%,rgba(216,178,74,.06),transparent 60%);
  }
  ::selection{background:var(--gold);color:var(--night)}
  .wrap{max-width:760px;margin:0 auto;padding:0 22px}

  header{text-align:center;padding:72px 0 30px}
  .moon-mark{font-size:80px;line-height:1;filter:drop-shadow(0 0 26px rgba(216,178,74,.35));
    animation:glow 7s ease-in-out infinite}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 20px rgba(216,178,74,.25))}
    50%{filter:drop-shadow(0 0 34px rgba(216,178,74,.45))}}
  @media(prefers-reduced-motion:reduce){.moon-mark{animation:none}}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(46px,11vw,86px);
    line-height:.98;margin:.28em 0 .14em;letter-spacing:-.02em}
  .disclaimer{font-family:var(--sans);color:var(--muted);font-size:13.5px;margin:.6em 0 0;letter-spacing:.01em}
  .quote{font-family:var(--serif);font-style:italic;color:var(--gold);
    font-size:clamp(13px,2.1vw,15px);line-height:1.45;margin:.9em auto 0;max-width:34ch}
  .ledger-line{color:var(--muted);font-size:14px;margin-top:16px}
  .ledger-line b{color:var(--bone);font-weight:500;font-variant-numeric:tabular-nums}

  .picker{margin:28px 0 4px}
  .picker label{display:block;font-family:var(--serif);font-style:italic;
    color:var(--muted);font-size:16px;margin-bottom:9px}
  .selwrap{position:relative;display:inline-block;width:100%;max-width:340px}
  select{-webkit-appearance:none;appearance:none;width:100%;
    background:var(--night-2);color:var(--bone);border:1px solid var(--line);
    border-bottom:2px solid var(--gold-dim);
    font-family:var(--serif);font-size:19px;padding:13px 44px 13px 16px;border-radius:3px;cursor:pointer}
  select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .selwrap::after{content:"🌘";position:absolute;right:15px;top:50%;
    transform:translateY(-50%);pointer-events:none;font-size:15px;opacity:.8}

  .oppwrap{margin-top:10px}
  .oppwrap::after{content:"⚔";opacity:.65}
  .smallsample{background:rgba(199,107,90,.1);border:1px solid rgba(199,107,90,.35);
    color:#e6b3a8;border-radius:5px;padding:12px 15px;font-size:13px;margin:0 0 20px;line-height:1.5}
  .smallsample b{color:#f0d0c8;font-weight:600}
  .tabs{display:flex;justify-content:center;gap:4px;margin:16px 0 2px}
  .tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);
    font-family:var(--serif);font-size:19px;padding:8px 18px;cursor:pointer;transition:color .2s}
  .tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
  .tab:hover{color:var(--bone)}
  .tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:18px 30px;margin:16px 0 26px}
  .ctl{display:flex;flex-direction:column;align-items:center;gap:8px}
  .wlabel{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px}
  .tabpane{min-height:120px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--night-2)}
  .seg button{background:transparent;border:0;color:var(--muted);font-family:var(--sans);
    font-size:14px;padding:9px 18px;cursor:pointer;border-right:1px solid var(--line);transition:color .2s,background .2s}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold)}
  .seg button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

  main{padding-bottom:80px}
  .team-hd{font-family:var(--serif);font-weight:600;font-size:clamp(26px,5.4vw,38px);
    margin:14px 0 2px;letter-spacing:-.01em}
  .win-tag{font-family:var(--sans);font-size:13px;color:var(--muted);margin:0 0 16px;font-variant-numeric:tabular-nums}
  .prophecy{font-family:var(--serif);font-style:italic;font-size:clamp(17px,3.2vw,21px);
    color:var(--gold);line-height:1.4;margin:.2em 0 1.5em;max-width:60ch}
  .prophecy .p-fine{display:block;font-style:normal;font-family:var(--sans);
    font-size:13px;color:var(--muted);margin-top:8px}

  .ladder{border-top:1px solid var(--line)}
  .rung{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:14px;
    padding:11px 0;border-bottom:1px solid var(--line)}
  .rung .em{font-size:20px;text-align:center}
  .rung .phase{font-size:14px;color:var(--muted);margin-bottom:6px}
  .rung .phase b{color:var(--bone);font-weight:500;font-size:15px;font-family:var(--serif);margin-right:8px}
  .track{height:7px;background:rgba(236,227,208,.07);border-radius:99px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));
    border-radius:99px;transform-origin:left;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
  .rec{font-variant-numeric:tabular-nums;font-size:14px;color:var(--bone);text-align:right;min-width:92px}
  .rec .pct{color:var(--muted);margin-left:8px}
  .rung.cursed .fill{background:linear-gradient(90deg,#7a3a30,var(--curse))}
  .rung.cursed .tag{color:var(--curse)}
  .rung.blessed .tag{color:var(--gold)}
  .rung.empty .rec{color:var(--muted)}
  .tag{font-family:var(--serif);font-style:italic;font-size:12px;margin-left:2px}

  .splits{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0 0}
  .chip{background:var(--night-2);border:1px solid var(--line);border-radius:99px;padding:8px 15px;font-size:13px;color:var(--muted)}
  .chip b{color:var(--bone);font-weight:500;font-variant-numeric:tabular-nums}
  .note{color:var(--muted);font-size:12.5px;margin-top:12px;font-style:italic;font-family:var(--serif)}

  .reckoning{margin-top:46px;background:var(--ledger-ink);border:1px solid rgba(104,192,201,.28);
    border-radius:5px;padding:28px 26px 24px}
  .reckoning h2{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ledger);margin:0 0 3px}
  .reckoning .sub{font-family:var(--sans);color:#9fb4ba;font-size:13.5px;margin:0 0 20px}
  .rrow{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:12px;padding:12px 0;
    border-top:1px solid rgba(104,192,201,.14);font-variant-numeric:tabular-nums}
  .rrow-lab{font-size:14.5px;color:#cfe1e4}
  .rrow-lab small{display:block;color:#7f979d;font-size:12px;margin-top:2px}
  .rrow-num{font-family:var(--sans);font-weight:600;font-size:22px;color:#eaf6f7}
  .rrow-num.dim{color:#6f8a90;font-weight:400}
  .rrow-num.hot{color:var(--ledger)}
  .verdict{margin-top:18px;font-size:13.5px;color:#9fb4ba;line-height:1.5}
  .verdict b{color:#eaf6f7;font-weight:600}

  .empty{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:20px;
    padding:38px 0 20px;line-height:1.5;border-top:1px solid var(--line)}

  .board-title{font-family:var(--serif);font-weight:600;font-size:clamp(24px,5.2vw,36px);
    margin:6px 0 2px;letter-spacing:-.01em}
  .board-sub{color:var(--muted);font-size:14px;margin:0 0 20px;font-family:var(--serif);font-style:italic}
  .board-note{text-align:center;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:13px;margin:-6px 0 16px}
  .metricseg{display:flex;justify-content:center;margin:2px 0 18px}
  .weeknav{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 20px}
  .weeknav button{background:var(--night-2);border:1px solid var(--line);color:var(--gold);
    font-size:20px;line-height:1;width:40px;height:40px;border-radius:99px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .2s}
  .weeknav button:hover{background:var(--night-3)}
  .weeknav button:disabled{opacity:.3;cursor:default}
  .weeknav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .wklabel{text-align:center;min-width:150px}
  .wklabel #wkName{font-family:var(--serif);font-size:20px;color:var(--bone);display:block}
  .wklabel small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
  .board{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
  .gamecard{background:var(--night-2);border:1px solid var(--line);border-radius:6px;padding:15px 17px}
  .gc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .gc-emoji{font-size:23px}
  .gc-phase{font-family:var(--serif);font-size:15px;color:var(--bone)}
  .gc-when{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .gc-team{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:15px;color:var(--muted)}
  .gc-left{display:flex;align-items:center;min-width:0}
  .gc-team .nm{font-family:var(--serif)}
  .gc-team .p{font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
  .gc-team.win .nm{color:var(--gold)}
  .gc-team.win{color:var(--bone)}
  .gc-tag{font-family:var(--sans);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--gold);background:var(--gold-soft);border:1px solid rgba(216,178,74,.32);
    border-radius:99px;padding:2px 8px;margin-left:10px;white-space:nowrap}
  footer{border-top:1px solid var(--line);padding:26px 0 60px;color:var(--muted);
    font-size:12.5px;text-align:center;line-height:1.7}
  .hidden{display:none}
</style>
</head>

<div class="wrap">
  <header>

  </div>

  <main>
    <section id="picks" class="tabpane">
      <p class="board-note" id="boardNote"></p>
      <div class="weeknav">

      </div>
      <div class="board" id="board"></div>

    <section id="history" class="tabpane hidden">
      <div class="picker">
        <label for="team">Consult the almanac on behalf of&hellip;</label>
        <div class="selwrap"><select id="team" aria-label="Choose a team"></select></div>

      <div id="verdict" class="hidden">
        <h2 class="team-hd" id="teamName"></h2>
        <p class="win-tag" id="winTag"></p>
        <div id="body"></div>
      </div>
    </section>
  </main>

  <footer>
    Records from every NFL game, 1999&ndash;present (regular season &amp; playoffs).
  </footer>
</div>

const pct = (w,l,t)=>{const g=w+l+t; return g? Math.round(1000*w/g)/10 : null;};
// metric-aware percentage and record for a bucket {w,l,t,c,nc}
const mPct = o => { if(METRIC==="ats"){const n=o.c+o.nc; return n?Math.round(1000*o.c/n)/10:null;}
  const n=o.w+o.l+o.t; return n?Math.round(1000*o.w/n)/10:null; };
const mRec = o => METRIC==="ats" ? `${o.c}\u2013${o.nc}` : `${o.w}\u2013${o.l}${o.t?('-'+o.t):''}`;
const minSeasonFor = n => n>=SEASONS.length ? SEASONS[0] : SEASONS[SEASONS.length-n];

function aggregate(team, minS, opp){
  const mk=()=>({w:0,l:0,t:0,c:0,nc:0,g:0});
  const phase=Array.from({length:8},mk);
  const venue={out:mk(),ind:mk()}, windy=mk(), fav=mk(), dog=mk();
  let n=0;
  const upd=(o,res,cov)=>{o.g++; if(res===1)o.w++; else if(res===0)o.l++; else o.t++;
    if(cov===1)o.c++; else if(cov===0)o.nc++;};
  for(const [s,ph,res,ven,wd,fv,op,cov] of DB.games[team]){
    if(s<minS) continue;
    if(opp && op!==opp) continue;
    n++;
    upd(phase[ph],res,cov);
    upd(ven?venue.out:venue.ind,res,cov);
    if(wd) upd(windy,res,cov);
    if(fv===1) upd(fav,res,cov); else if(fv===0) upd(dog,res,cov);
  }
  return {n,phase,venue,windy,fav,dog};
}

function prophecy(team, cIdx, cPct, cGood, cBad, oppName){
  const c = DB.phases[cIdx].name.toLowerCase(), name = NAMES[team]||team;
  if(METRIC==="ats"){
    if(oppName) return `Against the ${oppName} and against the number, the ${c} buries the ${name} at ${cGood}\u2013${cBad}. The moon does not cover.`;
    return `Against the spread, the ${c} is ruin for the ${name} — ${cGood}\u2013${cBad}. The moon does not cover.`;
  }
  if(oppName){
    return `Against the ${oppName}, the ${c} damns the ${name} to ${cGood}\u2013${cBad}. The rivalry bends to the sky.`;
  }
  const lines=[
    `When the ${c} rises, the ${name} are marked for defeat — ${cGood}\u2013${cBad}. So it is written.`,
    `The ${c} is a curse upon the ${name}: ${cGood} wins, ${cBad} losses, and the moon keeps its ledger.`,
    `Beware the ${c}. Under its light the ${name} manage only ${cPct}%. The sky does not bluff.`,
  ];
  return lines[cBad % lines.length];
}

  const cGood = METRIC==="ats"?cursed.p.c:cursed.p.w, cBad = METRIC==="ats"?cursed.p.nc:cursed.p.l;

  let html = `<p class="prophecy">${prophecy(team,cursed.i,cursed.pct,cGood,cBad,oppName)}`;
  html += `<span class="p-fine">Blessed by the ${DB.phases[blessed.i].name.toLowerCase()} (${blessed.pct}%${METRIC==="ats"?" ATS":""}).</span></p>`;

  html += `<div class="ladder">`;
  a.phase.forEach((p,i)=>{
    const pc = mPct(p);
    const cls = i===cursed.i ? "cursed" : (i===blessed.i ? "blessed" : (pc===null?"empty":""));
    const tag = i===cursed.i ? '<span class="tag">cursed</span>'
              : i===blessed.i ? '<span class="tag">blessed</span>' : '';
    const scale = pc===null?0:(pc/100).toFixed(3);
    const recTxt = pc===null ? `<span class="pct">&mdash;</span>` : `${mRec(p)}<span class="pct">${pc}%</span>`;
    html += `<div class="rung ${cls}"><div class="em">${DB.phases[i].emoji}</div>
      <div><div class="phase"><b>${DB.phases[i].name}</b>${tag}</div>
      <div class="track"><div class="fill" style="transform:scaleX(${scale})"></div></div></div>
      <div class="rec">${recTxt}</div></div>`;
  });
  html += `</div>`;

  // splits
  const chips=[];
  const chip=(lab,o)=>`<span class="chip">${lab} <b>${mPct(o)}%</b> (${mRec(o)})</span>`;
  if(a.venue.out.g) chips.push(chip('outdoors',a.venue.out));
  if(a.venue.ind.g) chips.push(chip('indoors',a.venue.ind));
  if(a.windy.g) chips.push(chip('wind 15+ mph',a.windy));
  if(chips.length){
    html += `<div class="splits">${chips.join('')}</div>`;
  }

  // vegas odds
  const favP = a.fav.g? mPct(a.fav):null;
  const dogP = a.dog.g? mPct(a.dog):null;
  if(favP!==null || dogP!==null){
    const favLab = METRIC==="ats" ? "When favored, they cover" : "When Vegas favored them";
    const dogLab = METRIC==="ats" ? "As an underdog, they cover" : "When Vegas doubted them";
    const sub = METRIC==="ats" ? `How the ${NAMES[team]||team} cover the spread by role.` : `How the ${NAMES[team]||team} fare by the point spread.`;
    html += `<div class="reckoning"><h2>Vegas Odds</h2><p class="sub">${sub}</p>`;
    if(favP!==null) html += `<div class="rrow"><div class="rrow-lab">${favLab}<small>${mRec(a.fav)}</small></div><div class="rrow-num hot">${favP}%</div></div>`;
    if(dogP!==null) html += `<div class="rrow"><div class="rrow-lab">${dogLab}<small>${mRec(a.dog)}</small></div><div class="rrow-num">${dogP}%</div></div>`;
    html += `</div>`;
  }

  document.getElementById('body').innerHTML = html;
  // animate fills
  const fills = document.querySelectorAll('#body .fill');
  fills.forEach(f=>{const t=f.style.transform;f.style.transform='scaleX(0)';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=t;}));});
  try{history.replaceState(null,'','#'+team);}catch(e){}
}

function updateStats(){
  const minS = minSeasonFor(winN);
  let g=0; const ss=new Set();
  for(const t of DB.teams) for(const r of DB.games[t]) if(r[0]>=minS){g++; ss.add(r[0]);}
  document.getElementById('statSeasons').textContent = ss.size;
  document.getElementById('statGames').textContent = Math.round(g/2).toLocaleString();
}

// segmented control
const seg=document.getElementById('seg');
WINDOWS.forEach(([lab,n])=>{
  const b=document.createElement('button');
  b.textContent = lab==="All"?"All":lab+" yrs";
  b.setAttribute('aria-pressed', n===winN?"true":"false");
  b.addEventListener('click',()=>{
    winN=n;
    seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    updateStats();
    renderWeek();
    if(curTeam) render(curTeam);
  });
  seg.appendChild(b);
});

// live moon
(function(){
  const now=new Date(),lunar=29.53058867,known=new Date(Date.UTC(2000,0,6,18,14));
  const age=(((now-known)/86400000)%lunar+lunar)%lunar, idx=Math.floor((age/lunar)*8+0.5)%8;
  const em=["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
  document.getElementById('liveMoon').textContent=em[idx];
})();

// build team picker
const sel=document.getElementById('team');
const opt=document.createElement('option');
opt.value='';opt.textContent='— choose a team —';opt.disabled=true;opt.selected=true;sel.appendChild(opt);
DB.teams.slice().sort((a,b)=>(NAMES[a]||a).localeCompare(NAMES[b]||b)).forEach(t=>{
  const o=document.createElement('option');o.value=t;o.textContent=NAMES[t]||t;sel.appendChild(o);});
function fillOpponents(team){
  const opps=[...new Set(DB.games[team].map(g=>g[6]))]
    .sort((a,b)=>(NAMES[a]||a).localeCompare(NAMES[b]||b));
  const os=document.getElementById('opp'); os.innerHTML='';
  const any=document.createElement('option'); any.value=''; any.textContent='against anyone'; os.appendChild(any);
  opps.forEach(o=>{const e=document.createElement('option');e.value=o;e.textContent='vs '+(NAMES[o]||o);os.appendChild(e);});
  document.getElementById('oppWrap').classList.remove('hidden');
}

sel.addEventListener('change',e=>{if(e.target.value){fillOpponents(e.target.value);render(e.target.value);}});
document.getElementById('opp').addEventListener('change',()=>{if(curTeam)render(curTeam);});

updateStats();
try{const h=location.hash.replace('#','');if(h&&DB.games[h]){sel.value=h;fillOpponents(h);render(h);
  document.querySelector('.tab[data-tab="history"]').setAttribute('aria-selected','true');
  document.querySelector('.tab[data-tab="picks"]').setAttribute('aria-selected','false');
  document.getElementById('history').classList.remove('hidden');
  document.getElementById('picks').classList.add('hidden');
}}catch(e){}

// ---- The Season by Moonlight (embedded full-season schedule) ----
function phaseForDate(d){const lunar=29.53058867,known=Date.UTC(2000,0,6,18,14);
  const age=(((d.getTime()-known)/86400000)%lunar+lunar)%lunar;return Math.floor((age/lunar)*8+0.5)%8;}
function teamPhase(team,ph){const g=DB.games[team]; if(!g)return null; const minS=minSeasonFor(winN);
  let w=0,l=0,c=0,nc=0;
  for(const r of g){if(r[0]<minS)continue; if(r[1]===ph){if(r[2]===1)w++;else if(r[2]===0)l++; if(r[7]===1)c++;else if(r[7]===0)nc++;}}
  const good=METRIC==="ats"?c:w, bad=METRIC==="ats"?nc:l, n=good+bad;
  return {good,bad,pct:n?Math.round(1000*good/n)/10:null};}
function fmtWhen(gameday,gametime){
  const d=new Date(gameday+"T12:00:00Z");
  const wd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()];
  if(!gametime) return wd;
  const [h,m]=gametime.split(":").map(Number);
  return `${wd} · ${((h+11)%12)+1}:${String(m).padStart(2,"0")} ${h>=12?"PM":"AM"} ET`;
}
function leanTag(gap){return gap===0?"Cosmic coin flip":gap>=15?"Strong moon lean":gap>=7?"Moon lean":"Slight moon lean";}

// group schedule by week
const WEEKS=[...new Set(SCHEDULE.map(g=>g[0]))].sort((a,b)=>a-b);
let wkIdx=0;
(function(){ // default to current/upcoming week
  const today=new Date().toISOString().slice(0,10);
  for(let i=0;i<WEEKS.length;i++){
    const last=SCHEDULE.filter(g=>g[0]===WEEKS[i]).reduce((m,g)=>g[1]>m?g[1]:m,"");
    wkIdx=i; if(last>=today) break;
  }
})();
function monthDay(s){return new Date(s+"T12:00:00Z").toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});}
function renderWeek(){
  const wk=WEEKS[wkIdx];
  const games=SCHEDULE.filter(g=>g[0]===wk).sort((a,b)=>(a[1]+a[2]).localeCompare(b[1]+b[2]));
  document.getElementById('wkName').textContent="Week "+wk;
  const d0=games[0][1], d1=games[games.length-1][1];
  document.getElementById('wkDates').textContent = d0===d1?monthDay(d0):`${monthDay(d0)} – ${monthDay(d1)}`;
  document.getElementById('wkPrev').disabled = wkIdx===0;
  document.getElementById('wkNext').disabled = wkIdx===WEEKS.length-1;
  const span = winN>=SEASONS.length ? `all ${SEASONS.length} seasons` : `the last ${winN} seasons`;
  document.getElementById('boardNote').textContent =
    `Weighed against ${span}, ${METRIC==="ats"?"against the spread":"straight up"}.`;
  const cell=r=>`${r.pct==null?'&mdash;':r.pct+'%'} <span style="opacity:.55">(${r.good}\u2013${r.bad})</span>`;
  const tagFor=gap=>gap>=15?"Strong lean":gap>=7?"Lean":"Slight lean";
  const row=(code,r,win,gap)=>`<div class="gc-team ${win?'win':''}"><span class="gc-left"><span class="nm">${NAMES[code]||code}</span>${win?`<span class="gc-tag">${tagFor(gap)}</span>`:''}</span><span class="p">${cell(r)}</span></div>`;
  document.getElementById('board').innerHTML=games.map(g=>{
    const ph=phaseForDate(new Date(g[1]+"T12:00:00Z")), P=DB.phases[ph];
    const away=g[3], home=g[4];
    const hp=teamPhase(home,ph), ap=teamPhase(away,ph);
    if(!hp||!ap) return '';
    const hv=hp.pct==null?0:hp.pct, av=ap.pct==null?0:ap.pct;
    const homeWin=hv>av, tie=hv===av, gap=Math.abs(hv-av);
    return `<div class="gamecard">
      <div class="gc-top"><span class="gc-emoji">${P.emoji}</span><span class="gc-phase">${P.name}</span><span class="gc-when">${fmtWhen(g[1],g[2])}</span></div>
      ${row(away,ap,!tie&&!homeWin,gap)}
      ${row(home,hp,!tie&&homeWin,gap)}
    </div>`;
  }).join('');
}
document.getElementById('wkPrev').addEventListener('click',()=>{if(wkIdx>0){wkIdx--;renderWeek();}});
document.getElementById('wkNext').addEventListener('click',()=>{if(wkIdx<WEEKS.length-1){wkIdx++;renderWeek();}});
renderWeek();

// metric toggle (Wins / Against the Spread) — drives both tabs
function syncSeg(id){document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.m===METRIC?'true':'false'));}
function setMetric(m){ if(m===METRIC) return; METRIC=m; syncSeg('metric'); renderWeek(); if(curTeam) render(curTeam); }
document.querySelectorAll('#metric button').forEach(b=>b.addEventListener('click',()=>setMetric(b.dataset.m)));

// tabs
function activateTab(which){
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x.dataset.tab===which?'true':'false'));
  document.getElementById('picks').classList.toggle('hidden', which!=='picks');
  document.getElementById('history').classList.toggle('hidden', which!=='history');
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>activateTab(t.dataset.tab)));
</script>
